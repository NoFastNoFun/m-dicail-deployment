# Production nginx — ACME webroot + HTTP→HTTPS redirect.
# Placeholders: __DOMAIN__ (public hostname) and __CERT_NAME__ (Let's Encrypt
# live directory). Replaced by ensure-site-tls.sh / Terraform, so nginx
# variables like $host keep a single dollar sign.
# default_server: Cloudflare may send Host: medicail.nf2.tech before the
# origin cert SAN matches; still serve the API instead of falling through.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://__DOMAIN__$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__CERT_NAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CERT_NAME__/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Helmet also sends HSTS; hide the upstream copy so clients see one header.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = / {
        proxy_pass http://api:8000/;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    location /health {
        proxy_pass http://api:8000;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    location = /reset-password {
        proxy_pass http://api:8000;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    location = /recovery {
        proxy_pass http://api:8000;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    location /api {
        proxy_pass http://api:8000;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    location /docs {
        proxy_pass http://api:8000/docs;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    location = /ai {
        return 301 /ai/;
    }

    location /ai/docs {
        proxy_pass http://ai:8001/docs;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    location /ai/ {
        proxy_pass http://ai:8001/api/;
        include /etc/nginx/snippets/proxy-headers.conf;
        client_max_body_size 100m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }
}
