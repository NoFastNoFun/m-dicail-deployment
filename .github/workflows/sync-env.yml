name: Sync VPS environment

on:
  workflow_dispatch:
    inputs:
      recreate_api:
        description: "Rebuild and restart the API container after syncing .env"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  sync-env:
    name: Push .env from GitHub Secrets to VPS
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/m-dicail' }}
      DOMAIN: ${{ vars.DOMAIN || 'medicail.nf2.tech' }}
      PORT: ${{ vars.PORT || '8000' }}
      AI_PORT: ${{ vars.AI_PORT || '8001' }}
      ACCESS_TOKEN_TTL: ${{ vars.ACCESS_TOKEN_TTL || '1h' }}
      REFRESH_TOKEN_TTL_DAYS: ${{ vars.REFRESH_TOKEN_TTL_DAYS || '7' }}
      SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.proton.me' }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
      WEBAUTHN_RP_NAME: ${{ vars.WEBAUTHN_RP_NAME || 'Medicail' }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_FROM: ${{ vars.SMTP_FROM }}

    steps:
      - name: Checkout deployment repo
        uses: actions/checkout@v4

      - name: Require VPS and core secrets
        run: |
          set -euo pipefail
          missing=0
          for name in VPS_HOST SECRET_KEY POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB SMTP_USER SMTP_PASS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret or variable ${name} is required (v0.0.11+ API refuses to boot without SMTP in production)"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Start SSH agent
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_SSH_PRIVATE_KEY}" ]; then
            echo "::error::Secret VPS_SSH_PRIVATE_KEY is required"
            exit 1
          fi
          eval "$(ssh-agent -s)"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          KEY_FILE="$(mktemp)"
          printf '%s\n' "${VPS_SSH_PRIVATE_KEY}" > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"
          ssh-add "${KEY_FILE}"
          rm -f "${KEY_FILE}"
          if [ -n "${VPS_SSH_KNOWN_HOSTS}" ]; then
            printf '%s\n' "${VPS_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${VPS_PORT}" -H "${VPS_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts
          echo "SSH_AUTH_SOCK=${SSH_AUTH_SOCK}" >> "$GITHUB_ENV"

      - name: Render and upload .env
        run: |
          set -euo pipefail
          bash scripts/render-env.sh > /tmp/m-dicail.env
          scp -P "${VPS_PORT}" /tmp/m-dicail.env "${VPS_USER}@${VPS_HOST}:/tmp/m-dicail.env"
          ssh -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" \
            "sudo install -m 600 -o root -g root /tmp/m-dicail.env '${DEPLOY_PATH}/.env' && rm -f /tmp/m-dicail.env"
          rm -f /tmp/m-dicail.env

      - name: Recreate API container
        if: inputs.recreate_api
        run: |
          set -euo pipefail
          ssh -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" \
            "cd '${DEPLOY_PATH}' && docker compose -f docker-compose.prod.yml up -d --build api"
