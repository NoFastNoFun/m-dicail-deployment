name: Deploy backend tag

on:
  workflow_dispatch:
    inputs:
      backend_tag:
        description: "Git tag on m-dicail-backend to deploy (e.g. v1.2.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Verify tag and deploy to VPS
    runs-on: ubuntu-latest
    env:
      BACKEND_REPO: ${{ vars.BACKEND_REPO || 'NoFastNoFun/m-dicail-backend' }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/m-dicail' }}
      DOMAIN: ${{ vars.DOMAIN || 'medicail.nf2.tech' }}
      ACME_EMAIL: ${{ vars.ACME_EMAIL }}
      BACKEND_REPO_URL: ${{ vars.BACKEND_REPO_URL || 'https://github.com/NoFastNoFun/m-dicail-backend.git' }}
      PORT: ${{ vars.PORT || '8000' }}
      AI_PORT: ${{ vars.AI_PORT || '8001' }}
      ACCESS_TOKEN_TTL: ${{ vars.ACCESS_TOKEN_TTL || '1h' }}
      REFRESH_TOKEN_TTL_DAYS: ${{ vars.REFRESH_TOKEN_TTL_DAYS || '7' }}
      SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.proton.me' }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
      WEBAUTHN_RP_NAME: ${{ vars.WEBAUTHN_RP_NAME || 'Medicail' }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_FROM: ${{ vars.SMTP_FROM }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
      FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}

    steps:
      - name: Checkout deployment repo
        uses: actions/checkout@v4

      - name: Normalize backend tag
        id: tag
        run: |
          TAG="${{ inputs.backend_tag }}"
          TAG="${TAG#refs/tags/}"
          TAG="$(echo -n "$TAG" | tr -d '[:space:]')"
          if [ -z "$TAG" ]; then
            echo "::error::backend_tag is empty after normalization"
            exit 1
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying backend tag: $TAG"

      - name: Verify tag exists on backend repository
        env:
          GH_TOKEN: ${{ secrets.BACKEND_READ_TOKEN || github.token }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          echo "Checking refs/tags/${TAG} on ${BACKEND_REPO}"
          if gh api --silent "repos/${BACKEND_REPO}/git/ref/tags/${TAG}"; then
            echo "Tag ${TAG} found on ${BACKEND_REPO}"
          else
            echo "::error::Tag '${TAG}' does not exist on ${BACKEND_REPO}. Create and push the tag on the backend repo before deploying."
            exit 1
          fi

      - name: Require VPS and app secrets
        run: |
          set -euo pipefail
          missing=0
          for name in VPS_HOST SECRET_KEY POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB SMTP_USER SMTP_PASS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret ${name} is required (tag deploy writes /opt/m-dicail/.env from GitHub)"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Start SSH agent and load key
        uses: ./.github/actions/setup-vps-ssh
        with:
          ssh_private_key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          ssh_known_hosts: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          vps_host: ${{ secrets.VPS_HOST }}
          vps_port: ${{ secrets.VPS_PORT || '22' }}

      - name: Sync stack files and deploy script to VPS
        run: |
          set -euo pipefail
          ssh -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" \
            "sudo mkdir -p '${DEPLOY_PATH}/nginx/conf.d' '${DEPLOY_PATH}/nginx/snippets' '${DEPLOY_PATH}/.generated/lib' && sudo chown -R '${VPS_USER}:${VPS_USER}' '${DEPLOY_PATH}' && if [ -f '${DEPLOY_PATH}/.env' ]; then sudo chown root:root '${DEPLOY_PATH}/.env' && sudo chmod 600 '${DEPLOY_PATH}/.env'; fi"

          scp -P "${VPS_PORT}" \
            docker/docker-compose.prod.yml \
            "${VPS_USER}@${VPS_HOST}:${DEPLOY_PATH}/docker-compose.prod.yml"

          scp -P "${VPS_PORT}" \
            docker/nginx/nginx.conf \
            "${VPS_USER}@${VPS_HOST}:${DEPLOY_PATH}/nginx/nginx.conf"

          scp -P "${VPS_PORT}" \
            terraform/templates/nginx-default.conf \
            "${VPS_USER}@${VPS_HOST}:${DEPLOY_PATH}/nginx/nginx-default.conf.tpl"

          scp -P "${VPS_PORT}" \
            docker/nginx/snippets/proxy-headers.conf \
            "${VPS_USER}@${VPS_HOST}:${DEPLOY_PATH}/nginx/snippets/proxy-headers.conf"

          scp -P "${VPS_PORT}" \
            scripts/configure-host-firewall.sh \
            "${VPS_USER}@${VPS_HOST}:${DEPLOY_PATH}/.generated/configure-host-firewall.sh"

          scp -P "${VPS_PORT}" \
            scripts/ensure-site-tls.sh \
            "${VPS_USER}@${VPS_HOST}:${DEPLOY_PATH}/.generated/ensure-site-tls.sh"

          scp -P "${VPS_PORT}" \
            scripts/lib/common.sh \
            scripts/lib/git-backend.sh \
            "${VPS_USER}@${VPS_HOST}:${DEPLOY_PATH}/.generated/lib/"

          scp -P "${VPS_PORT}" \
            scripts/deploy-backend-tag.sh \
            "${VPS_USER}@${VPS_HOST}:${DEPLOY_PATH}/.generated/deploy-backend-tag.sh"

      - name: Render and upload .env from GitHub
        run: |
          set -euo pipefail
          bash scripts/render-env.sh > /tmp/m-dicail.env
          scp -P "${VPS_PORT}" /tmp/m-dicail.env "${VPS_USER}@${VPS_HOST}:/tmp/m-dicail.env"
          ssh -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" \
            "sudo install -m 600 -o root -g root /tmp/m-dicail.env '${DEPLOY_PATH}/.env' && rm -f /tmp/m-dicail.env"
          rm -f /tmp/m-dicail.env

      - name: Deploy tag on VPS
        env:
          TAG: ${{ steps.tag.outputs.value }}
          BACKEND_GIT_TOKEN: ${{ secrets.BACKEND_READ_TOKEN }}
        run: |
          set -euo pipefail
          # Install PAT on the VPS (mode 600) for non-interactive private git over HTTPS.
          if [ -n "${BACKEND_GIT_TOKEN}" ]; then
            printf '%s' "${BACKEND_GIT_TOKEN}" | ssh -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" \
              "sudo mkdir -p '${DEPLOY_PATH}/.generated' && sudo tee '${DEPLOY_PATH}/.generated/backend-git-token' >/dev/null && sudo chmod 600 '${DEPLOY_PATH}/.generated/backend-git-token'"
          fi

          ssh -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" \
            "sudo chmod 755 '${DEPLOY_PATH}/.generated/deploy-backend-tag.sh' '${DEPLOY_PATH}/.generated/lib/'*.sh && \
             sudo env \
              BACKEND_TAG='${TAG}' \
              DEPLOY_PATH='${DEPLOY_PATH}' \
              BACKEND_REPO_URL='${BACKEND_REPO_URL}' \
              DOMAIN='${DOMAIN}' \
              ACME_EMAIL='${ACME_EMAIL}' \
              SSH_PORT='${VPS_PORT}' \
              MANAGE_FIREWALL='true' \
              bash '${DEPLOY_PATH}/.generated/deploy-backend-tag.sh'"
