services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # No host ports. Reachable only on the internal Docker network.
    networks:
      - db

  api:
    build:
      context: ./backend
      args:
        APP: api
    # expose = Compose network only; never publishes on the host.
    expose:
      - "8000"
    environment:
      - PORT=${PORT:-8000}
      - NODE_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - NCBI_API_KEY=${NCBI_API_KEY}
      - NCBI_EMAIL=${NCBI_EMAIL:-}
      - ACCESS_TOKEN_TTL=${ACCESS_TOKEN_TTL:-1h}
      - REFRESH_TOKEN_TTL_DAYS=${REFRESH_TOKEN_TTL_DAYS:-7}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-}
      - WEBAUTHN_RP_NAME=${WEBAUTHN_RP_NAME:-Medicail}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - edge
      - db

  ai:
    build:
      context: ./backend
      args:
        APP: ai
    expose:
      - "8001"
    environment:
      - AI_PORT=${AI_PORT:-8001}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - edge

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - api
      - ai
    restart: unless-stopped
    networks:
      - edge

volumes:
  postgres_data:

networks:
  # nginx <-> api/ai only
  edge:
    driver: bridge
  # api <-> postgres only (not attached to nginx)
  db:
    driver: bridge
    internal: true
