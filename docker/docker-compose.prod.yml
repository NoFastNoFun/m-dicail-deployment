services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # No host ports. Reachable only on the internal Docker network.
    networks:
      - db

  api:
    build:
      context: ./backend
      args:
        APP: api
    # expose = Compose network only; never publishes on the host.
    expose:
      - "8000"
    environment:
      - PORT=${PORT:-8000}
      - NODE_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - NCBI_API_KEY=${NCBI_API_KEY}
      - NCBI_EMAIL=${NCBI_EMAIL:-}
      - ACCESS_TOKEN_TTL=${ACCESS_TOKEN_TTL:-1h}
      - REFRESH_TOKEN_TTL_DAYS=${REFRESH_TOKEN_TTL_DAYS:-7}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-https://medicail.nf2.tech}
      - APP_DEEPLINK_SCHEME=${APP_DEEPLINK_SCHEME:-medicail}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://medicail.nf2.tech}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-medicail.nf2.tech}
      - WEBAUTHN_RP_NAME=${WEBAUTHN_RP_NAME:-Medicail}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-https://medicail.nf2.tech}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL:-}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --timeout=3 http://127.0.0.1:$${PORT:-8000}/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    restart: unless-stopped
    networks:
      - edge
      - db

  ai:
    build:
      context: ./backend
      args:
        APP: ai
    expose:
      - "8001"
    environment:
      - AI_PORT=${AI_PORT:-8001}
      - SECRET_KEY=${SECRET_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      - GROQ_TRANSCRIPTION_MODEL=${GROQ_TRANSCRIPTION_MODEL:-whisper-large-v3-turbo}
      - GROQ_TIMEOUT_MS=${GROQ_TIMEOUT_MS:-120000}
    healthcheck:
      # No /health on the AI app; any HTTP response means the process is up.
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:'+(process.env.AI_PORT||8001)+'/',r=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    restart: unless-stopped
    networks:
      - edge

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
      ai:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - edge

volumes:
  postgres_data:

networks:
  # nginx <-> api/ai only
  edge:
    driver: bridge
  # api <-> postgres only (not attached to nginx)
  db:
    driver: bridge
    internal: true
